<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道德经 · 炼化炉</title>
<meta name="description" content="《道德经》炼化炉：投入章句，炼出一字金丹 · 一句丹诀 · 本意引申 · 人生健康宇宙三维">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="paper">

  <!-- ============ 抬头 ============ -->
  <header class="masthead">
    <div class="seal">道</div>
    <h1>道德经 · 炼化炉</h1>
    <p class="sub">一字一重天</p>
  </header>

  <!-- ============ 炼化炉 ============ -->
  <section class="furnace" id="furnace">
    <div class="furnace-body">

      <div class="flame" id="flame">
        <span class="f1"></span><span class="f2"></span><span class="f3"></span>
      </div>

      <div class="furnace-head">
        <h2><span class="fx">炼</span> 投 料 入 炉</h2>
        <p class="furnace-sub">引原文章句，或就此章之义理申说。无根者不结丹。</p>
      </div>

      <div class="furnace-mouth">
        <textarea id="charge" rows="3" placeholder="例：上善若水，水善利万物而不争，处众人之所恶，故几于道。&#10;或：第11章 有之以为利，无之以为用，对我做产品很有启发"></textarea>
        <div class="mouth-line"></div>
      </div>

      <div class="furnace-actions">
        <button class="btn-forge" id="forgeBtn">
          <span class="btn-flame"></span>开 炉 炼 化
        </button>
        <button class="btn-clear" id="clearBtn">清 炉</button>
      </div>

      <div class="assay" id="assay" hidden></div>

      <div class="samples">
        <span class="samples-label">可试：</span>
        <button class="sample" data-t="上善若水，水善利万物而不争，处众人之所恶，故几于道。">上善若水</button>
        <button class="sample" data-t="反者道之动，弱者道之用。这是循环的智慧">反者道之动</button>
        <button class="sample" data-t="知人者智，自知者明。胜人者有力，自胜者强。">自知者明</button>
        <button class="sample" data-t="加油，相信自己，你一定能成功！">（反例）</button>
      </div>

    </div>
  </section>

  <!-- ============ 金丹 ============ -->
  <section class="dan-result" id="danResult" hidden></section>

  <!-- ============ 藏丹阁 ============ -->
  <section class="vault">
    <div class="vault-head">
      <h2>藏 丹 阁</h2>
      <div class="progress-wrap">
        <div class="progress-bar"><span id="pbar"></span></div>
        <p class="progress-text"><span id="ptext">加载中</span></p>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="检索章节、章句或金丹字，如：水 / 无为 / 知足" autocomplete="off">
      <div class="filters" id="filters"></div>
    </div>

    <main id="grid" class="grid"></main>
    <p id="empty" class="empty" hidden>没有匹配的章节，换个词试试。</p>
  </section>

  <footer class="foot">
    <p>投料 · 试火 · 结丹 · 藏阁</p>
    <p class="foot-minor">本意 · 引申义 · 人生自主 · 健康养生 · 自然宇宙</p>
  </footer>

</div>

<!-- ============ 章节详情 ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-bg" data-close></div>
  <article class="sheet">
    <button class="close" data-close aria-label="关闭">×</button>
    <div id="detail"></div>
  </article>
</div>

<script src="./furnace.js"></script>
<script src="./app.js"></script>
</body>
</html>
