<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问道 · 道德经炼化炉</title>
<meta name="description" content="问道：说出你的困惑，道童接住转交炉灵，从八十一章金丹里指出哪几章在回答你。">
<meta property="og:title" content="问道 · 道德经 AI 智能炼化炉">
<meta property="og:description" content="道童接问，转交炉灵取丹。从八十一章里指出哪几章在回答你。">
<meta property="og:type" content="website">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="paper">

  <!-- ============ 抬头（一行） ============ -->
  <header class="masthead masthead-row">
    <span class="seal seal-row">问</span>
    <div class="mh-text">
      <h1>问 道</h1>
      <p class="sub">有 困 惑 就 问　·　道童接住，转炉灵替你取丹</p>
    </div>
  </header>

  <!-- ============ 顶栏 · 三模块固化 ============ -->
  <nav class="topbar" id="topbar">
    <div class="tb-inner">
      <div class="tb-tabs">
        <a class="tb-tab on" href="./"><span class="tb-k">一</span><span class="tb-t">问 道</span></a>
        <a class="tb-tab" href="./refine.html"><span class="tb-k">二</span><span class="tb-t">炼 丹</span></a>
        <a class="tb-tab" href="./vault.html"><span class="tb-k">三</span><span class="tb-t">藏 丹 阁</span></a>
      </div>
    </div>
  </nav>

  <!-- ============ 问道（正门） ============ -->
  <section class="ask-box home-ask" id="homeAsk">
    <div class="ask-field">
      <textarea id="homeQ" rows="3" placeholder="你有什么困惑？例：我最近很焦虑，静不下来 / 干得多，功劳却被别人抢了 / 不知道该不该辞职"></textarea>
      <div class="ask-line"></div>
    </div>
    <div class="ask-actions">
      <button class="btn-ask" id="homeAskBtn"><span class="btn-orb"></span>问 道</button>
      <a class="btn-clear btn-to-ask" href="./ask.html">细 问 与 浏 览</a>
    </div>
    <div class="ask-samples" id="homeSamples"></div>
    <div id="lingStrip"></div>
  </section>

  <!-- ============ 答面 ============ -->
  <section class="ask-answer home-answer" id="homeAnswer" hidden></section>

  <!-- ============ 炉中三位 · 一条通路 ============ -->
  <section class="more-sect" id="moreBody">

      <div class="trio-wrap">
        <h3 class="trio-title">炉 中 三 位 <em>A I</em></h3>
        <p class="trio-sub">炉中三位皆是 AI。接料、试火、守丹，尽是 AI。</p>

        <div class="pathway">
          <div class="pw-title">一 条 通 路</div>
          <div class="pw-flow">
            <span class="pw-node pw-gate">有 人 来</span>
            <span class="pw-arrow">→</span>
            <span class="pw-node pw-tong">道 童<i>接</i></span>
            <span class="pw-arrow">→</span>
            <span class="pw-branch">
              <span class="pw-node pw-shi">丹 师<i>炼化</i></span>
              <span class="pw-node pw-ling">炉 灵<i>问道</i></span>
            </span>
            <span class="pw-arrow">→</span>
            <span class="pw-node pw-out">金 丹 · 解 惑</span>
          </div>
          <p class="pw-note">
            炼化也好，问道也好，都先过道童这一关——他是炉子的门。
            炼化由道童转交丹师，问道由道童转交炉灵。
          </p>
        </div>

        <div id="trioBox"></div>
      </div>

  </section>

  <footer class="foot">
    <p>问 · 投 · 炼 · 藏</p>
    <p class="foot-minor">AI 智能炉 · 道童接料 · 丹师试火 · 炉灵取丹</p>
  </footer>

</div><!-- /paper -->

<!-- ============ 章节详情 ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-bg" data-close></div>
  <article class="sheet">
    <button class="close" data-close aria-label="关闭">×</button>
    <div id="detail"></div>
  </article>
</div>

<!-- ============ 随取炉 · 挥之即来，用之即去 ============ -->
<div class="pocket" id="pocket">
  <button class="pocket-btn" id="pocketBtn" aria-label="展开随身炉">
    <svg viewBox="0 0 32 32" class="pocket-ico" aria-hidden="true">
      <path d="M5 12h22l-1.6 4.2H6.6L5 12z" fill="currentColor"/>
      <path d="M8 16.6h16l-1.5 9.4H9.5L8 16.6z" fill="currentColor" opacity=".82"/>
      <rect x="12.5" y="4" width="7" height="5.4" rx="1.2" fill="currentColor" opacity=".5"/>
      <circle cx="16" cy="6.6" r="1.5" fill="#f0d489"/>
      <path d="M4 9.5h24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".35"/>
    </svg>
    <span class="pocket-tip">随 身 炉</span>
  </button>

  <div class="pocket-sheet" id="pocketSheet" hidden>
    <div class="pk-head">
      <span class="pk-k">随 身 炉</span>
      <span class="pk-note">挥之即来　用之即去</span>
      <button class="pk-close" id="pocketClose" aria-label="收起">×</button>
    </div>
    <div class="pk-body">
      <div class="pk-row">
        <label class="pk-lab">投 料 炼 化</label>
        <textarea id="pkCharge" rows="2" placeholder="贴上你要炼化的章句或转写稿"></textarea>
        <div class="pk-acts">
          <button class="btn-forge btn-forge-sm" id="pkForge"><span class="btn-flame"></span>入 炉</button>
          <button class="btn-clear btn-clear-sm" id="pkClear">清 炉</button>
        </div>
      </div>
      <div class="pk-row">
        <label class="pk-lab">问 道 取 丹</label>
        <input id="pkQ" type="text" placeholder="你的困惑，一句话" />
        <div class="pk-acts">
          <button class="btn-ask btn-ask-sm" id="pkAsk"><span class="btn-orb"></span>问 道</button>
        </div>
      </div>
      <div id="pkTong" class="pk-tong" hidden></div>
      <div class="prog-box pk-prog" id="pkProg" hidden></div>
      <div id="pkOut" class="pk-out" hidden></div>
      <div class="pk-foot">
        <a class="dan-link" href="./refine.html">入 炼 丹 炉 →</a>
        <span>·</span>
        <a class="dan-link" href="./vault.html">藏 丹 阁 →</a>
      </div>
    </div>
  </div>
</div>

<script src="./spirits.js"></script>
<script src="./furnace.js"></script>
<script src="./progress.js"></script>
<script src="./ask.js"></script>
<script src="./ingest.js"></script>
<script src="./app.js"></script>
</body>
</html>
