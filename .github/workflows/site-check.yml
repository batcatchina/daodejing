name: Site Health Check

on:
  push:
    paths: ['.github/workflows/site-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP probe
        run: |
          for u in \
            "https://daodejing.zheng-he.top" \
            "https://daodejing-lianhua.vercel.app" \
            "https://www.zheng-he.top"; do
            printf "### %s\n" "$u"
            curl -sSL -m 25 -o /dev/null -w "  code=%{http_code} time=%{time_total}s ip=%{remote_ip}\n" "$u" || echo "  FAILED"
          done

      - name: Content check
        run: |
          curl -sSL -m 25 "https://daodejing.zheng-he.top" -o /tmp/p.html
          echo "  title: $(grep -o '<title>[^<]*</title>' /tmp/p.html || echo none)"
          echo "  bytes: $(wc -c < /tmp/p.html)"
          curl -sSL -m 25 "https://daodejing.zheng-he.top/data/index.json" -o /tmp/d.json
          python3 -c "import json; d=json.load(open('/tmp/d.json')); print('  chapters:', d['total'], 'refined:', d['refined'])"

      - name: DNS from runner
        run: nslookup daodejing.zheng-he.top 2>&1 | head -8 || true
